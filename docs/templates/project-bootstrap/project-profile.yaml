# Canonical project profile template (director-project-profile/v1).
# Do not place secrets, credentials, tokens, or raw private source here.
# Workflow skills are procedure overlays, not permission grants.
# Provider roles and debate rules: docs/team-operating-charter.md
schema_version: "director-project-profile/v1"

project:
  id: "<short-stable-project-id>"
  name: "<working project name>"
  rollout_packet: "rollout-packet.md"
  proposition: "<what this project may accomplish, learn, decide, or change>"
  state: "exploring" # exploring | framing | building | validating | operating | paused | closed
  owner: "<owner or authorized source>"
  created_at: "<ISO-8601 timestamp>"
  updated_at: "<ISO-8601 timestamp>"

source_context:
  thread: "<link, identifier, or none>"
  preserve:
    - "<useful pattern, lesson, or constraint>"
  reshape:
    - "<element that must become project-specific>"
  discard:
    - "<source-project assumption that does not belong>"
  inherited_authority: false

outcomes:
  desired:
    - value: "<tentative or confirmed outcome>"
      status: "provisional" # confirmed | provisional | unknown | not_applicable
  non_goals:
    - "<explicit non-goal>"
  evidence_standard:
    - "<evidence required for the current phase>"
  stopping_point: "<decision, threshold, budget, date, failure, or safety condition>"

surfaces:
  deployment:
    intent: "analysis_only" # analysis_only | planned | live
    concurrently_active: "unknown" # true | false | unknown
    profile: "<ignored environment-file name or not_created>"
    compose_namespace: "<project-specific namespace or not_created>"
    state_namespace: "<project-specific database/volume/checkpoint namespace or not_created>"
    status: "provisional"
  slack:
    workspace_id: "<workspace ID or unknown>"
    owner_user_allowlist_reference: "<ignored-profile or secret-store reference, non-reversible verification digest, or pending>"
    runtime_channel_allowlist:
      - "<exact project channel ID or pending>"
    app:
      display_name: "<project-specific Slack app name or pending>"
      app_id: "<Slack app ID or pending>"
      bot_user_id: "<exact Slack bot user ID or pending>"
      manifest_sha256: "<64-hex manifest digest or pending>"
      installation_status: "provisional"
      socket_mode_status: "provisional"
      credential_references:
        app_token: "SLACK_APP_TOKEN"
        bot_token: "SLACK_BOT_TOKEN"
    channel: "<slack channel ID or configured placeholder; not a hardcoded workspace name>"
    thread: "<thread timestamp/link or not_created>"
    status: "provisional"
    isolation:
      dedicated_app_per_active_deployment: true
      dedicated_channel_per_active_deployment: true
      distinct_profile_and_state_namespace: true
      concurrent_deployment_collision_check: "pending"
  repositories:
    - name: "<exact owner/name>"
      starting_ref: "<durable ref>"
      worktree: "<verified project-local path>"
      status: "provisional"
  systems_and_data:
    classification: "<public | private | sensitive | mixed | none | unknown>"
    allowed_sources: []
    prohibited_sources: []
  browser_conversations:
    - "<existing continuity conversation or none>"
  external_effects:
    mode: "analysis_only" # analysis_only | explicitly_scoped
    allowed: []
    prohibited: []

modules:
  discovery:
    state: "enabled" # enabled | optional | disabled | unknown
    purpose: "<current reason>"
  research_and_evidence:
    state: "optional"
    purpose: "<current reason>"
  design_and_decision:
    state: "optional"
    purpose: "<current reason>"
  implementation:
    state: "optional"
    purpose: "<current reason>"
  quality_and_security:
    state: "optional"
    purpose: "<current reason>"
  review_to_merge:
    state: "optional"
    purpose: "<current reason>"
  operations:
    state: "disabled"
    purpose: "<current reason>"
  learning_and_reuse:
    state: "optional"
    purpose: "<current reason>"

team:
  # Project-local provider roles, boundaries, and the eight responsibility areas:
  # docs/templates/project-bootstrap/provider-roles-contract.yaml
  provider_roles_contract: "provider-roles-contract.yaml"
  director:
    provider: "claude"
    # Acting leadership is separate from the actual runtime provider.
    # Keep Moderator, Participant and Director distinct per the roles contract.
    responsibilities: ["framing", "routing", "synthesis", "acceptance"]
  lanes:
    - id: "<lane-id>"
      provider: "<claude | cursor | grok | gemini_antigravity | perplexity | other>"
      role: "<producer | researcher | verifier | reviewer | operator>"
      workflow_skill: "<catalog skill name or none>"
      responsibilities:
        - "<bounded responsibility>"
      forbidden_authority:
        - "<authority this lane must not infer>"
        # gemini_antigravity: POSITION/REBUTTAL only after a matching persisted
        # Director invitation; may not initiate; an invited vote stays advisory
        # and grants no review, acceptance, merge, deployment, or write authority
  shared_skill_catalog:
    cursor_agent_workflow: "unknown" # discovered | unavailable | unknown
    antigravity_sandbox_workflow: "unknown"
    perplexity_research_workflow: "unknown"

coordination:
  live_transport: "slack"
  execution_transport: "local_cli_in_verified_worktree"
  canonical_review_and_merge: "github"
  browser_role: "continuity_only"
  provider_messages_relay_through_director: true

contribution_attribution:
  enabled: true
  canonical_format: "[[Contributor | System | YYYY-MM-DD | HH:MM UTC | BEGIN|END]]"
  preserve_prior_valid_tags: true
  safe_human_text: "matching_inline_or_message_envelope"
  structured_or_syntax_sensitive_artifacts: "external_submission_envelope"
  authentication_or_authority_effect: "none"

controls:
  total_budget: "<ceiling or owner decision required>"
  phase_budget: "<ceiling or owner decision required>"
  timeout: "<bounded duration>"
  provider_contact_attempt_limit: 3
  minimal_fix:
    enabled: true
    attempt_limit: 3
    changed_candidate_invalidates_evidence: true
  revision_limit: "<bounded count>"
  hop_limit: "<bounded count>"
  allowlists:
    # Intent-only placeholders until owner-approved values are configured in runtime policy.
    projects: []
    repositories: []
    starting_refs: []
  approval_gates:
    - "<required owner or deterministic gate>"
  acceptance_checks:
    - "<observable check>"
  serious_safety_stop: true

review_chain:
  producer: "<provider or unassigned>"
  material_authors: []
  eligible_reviewer: "<different provider or unassigned>"
  candidate:
    repository: "<exact owner/name or none>"
    base_sha: "<40-hex SHA or none>"
    head_sha: "<40-hex SHA or none>"
    artifact_digest: "<digest or none>"
  required_evidence:
    - "different-provider exact-candidate review"
    - "current security evidence when configured"
    - "trusted CI when configured"
  candidate_change_invalidates_evidence: true
  merge_authority: "deterministic_gate_after_all_required_approval"

assumptions:
  confirmed: []
  provisional: []
  unknown: []
  not_applicable: []

fallbacks:
  unavailable_provider: "<replacement, reduced scope, or owner decision>"
  incomplete_evidence: "<research, experiment, pause, or owner decision>"
  ambiguous_paid_dispatch: "reconcile_existing_run_before_retry"
  slack_delivery:
    retry_limit: 3
    additional_attempt_requires: "second_temporary_failure_third_new_information_or_different_transport"
    resource_budget_required: true
    ambiguous_slack_side_effect: "do_not_retry_reconcile_first"
    exhausted_route: "same_project_durable_transport_never_borrow_another_deployment_surface"
  changed_scope: "reshape_profile_before_dependent_work"

next:
  action: "<one bounded next action>"
  responsible_party: "<provider, Director, or owner>"
  expected_evidence: "<what this action should add>"

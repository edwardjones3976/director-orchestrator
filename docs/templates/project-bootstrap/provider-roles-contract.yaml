# Canonical project-local provider roles contract (director-provider-roles/v1).
#
# This template records project-local role scope only. It grants no authority.
# It changes no committee voting weight, runtime permission, provider credential,
# deployment, or Slack behaviour, and it never overrides deterministic policy.
#
# Naming note: `deep_reasoning` is the canonical charter name for the area also
# described informally as "deep thinking". The canonical name is used here so a
# drift test can compare this contract against the charter field by field.
#
# Do not place secrets, credentials, tokens, or raw private source here.
schema_version: "director-provider-roles/v1"
authority_granted: "none"

source_of_truth:
  charter_document: "docs/team-operating-charter.md"
  charter_module: "src/director_orchestrator/team_charter.py"
  precedence: "charter_and_deterministic_policy_override_this_template"
  drift_rule: "If this contract and the charter disagree, the charter wins and this file is wrong."

# The eight stable responsibility areas. Names and expectations are mirrored
# exactly from the charter's `responsibility_areas`; a drift test enforces it.
responsibility_areas:
  - name: "research"
    expectation: "Research relevant sources; preserve provenance and label facts, inference, dissent, and unknowns."
  - name: "evidence_verification"
    expectation: "Cross-check material claims; report contradictions, freshness, and gaps."
  - name: "programming"
    expectation: "Build and maintain only within assigned repositories, paths, tools, and effects."
  - name: "deep_reasoning"
    expectation: "Compare alternatives, challenge assumptions, and recommend from evidence."
  - name: "innovation"
    expectation: "Test novel approaches through bounded, reversible experiments."
  - name: "development"
    expectation: "Improve projects and team capability through clear handoffs and reusable knowledge."
  - name: "quality_assurance"
    expectation: "Reproduce defects, test by risk, and never treat partial evidence as readiness."
  - name: "leadership"
    expectation: "Coordinate dependencies and dissent under owner intent and deterministic policy."

allocation_and_selection:
  enforced_ledger: "real_assignment_admissions"
  accepted_output_ledger: "separate_authenticated_accepted_production"
  default_profile: "engineering"
  allocation_profiles:
    lane_order: [openai, claude, cursor, grok, antigravity, perplexity, firecrawl, github-copilot]
    weights:
      engineering: [40, 25, 15, 10, 10, 0, 0, 0]
      mixed: [27, 33, 10, 10, 5, 5, 5, 5]
      public_research: [20, 25, 5, 5, 5, 25, 15, 0]
      enterprise: [32, 38, 5, 5, 5, 0, 5, 10]
  profile_binding: "frozen_before_approval_preserve_real_history_no_silent_redistribution"
  zero_target: "ineligible"
  total_effort_status: "separate_telemetry_not_production_credit"
  normal_tolerance_percentage_points: 3
  hard_ceiling_above_target_percentage_points: 5
  allocation_unit: "assignment_count"
  prospective_window_assignments: 20
  insufficient_history_action: "fixed_twenty_slots_real_assignments_only"
  selection_policy: "cheap_capable_model_first"
  selection_order:
    - "exact scope, allowlists, transport, and readiness"
    - "task capability, tools, context, risk, and reviewer independence"
    - "accepted-productive-work allocation compliance and under-target preference"
    - "total-effort eligibility and corrective under-band preference"
    - "lowest trusted comparable estimated cost"
    - "deterministic tie-breaker"
  missing_cost_rule: "Unknown cost is never treated as zero or automatically cheapest."
  claude_requirement_rule: "An exact trusted assignment requirement may select Claude or a named model profile; workload length alone does not."
  provider_output_may_expand_eligibility: false
  selection_record_requires:
    - "eligible candidate set"
    - "exclusion reasons"
    - "trusted comparable costs"
    - "selected provider and model"
    - "deterministic tie-break reason"
  value_and_waste:
    accepted_productive_unit: "authenticated accepted direct-production effort point"
    estimated_roi: "accepted productive units divided by recorded estimated cost"
    provider_reported_cost_roi: "only when correlated provider-reported cost exists; never invent or blend missing telemetry"
    first_pass_yield: "accepted primary-attempt results divided by primary attempts"
    correction_rate: "reviewable candidates requiring correction divided by reviewable candidates"
    waste_unit: "invoked effort without accepted productive credit"
    waste_categories:
      - "rejected or unusable output"
      - "quota or unavailable invocation"
      - "duplicate dispatch"
      - "duplicate validation"
      - "recovery attempt"
      - "ambiguous dispatch"
      - "rejected supplemental-review finding"

project_leadership:
  acting_director: "openai"
  default_runtime_director: "openai"
  role_change_activates_provider: false
  history: "preserve_actual_provider_model_and_receipt_identity"

providers:

  cursor:
    team: "primary"
    eligible_responsibility_areas:
      - "research"
      - "evidence_verification"
      - "programming"
      - "deep_reasoning"
      - "innovation"
      - "development"
      - "quality_assurance"
      - "leadership"
    eligible_complexity: ["low", "medium", "high", "critical"]
    may_handle_critical_work: true
    routing_policy:
      capability_parity_target: 1.0
      comparison_peers: ["claude", "openai_codex"]
      statement: "Route Cursor at full task-capability parity with Claude and Codex, by fit, independence, capacity, and evidence needs."
      parity_is_not:
        - "a benchmark, score, ranking, or measured performance claim"
        - "permission, access, or credential expansion"
        - "sole acceptance authority"
        - "authority to review or approve its own work"
        - "merge, deployment, or publication authority"
        - "safety authority"
    non_substitution_rules:
      - "Cursor cannot substitute for assignment-scoped acceptance authority."
      - "Codex Security remains an independent deterministic gate where configured."
      - "Cursor cannot review or approve its own work."
      - "Capability parity does not bypass assignment scope or deterministic gates."

  grok:
    provider: "xai"
    family: "cursor"
    team: "primary"
    eligible_responsibility_areas:
      - "research"
      - "evidence_verification"
      - "programming"
      - "deep_reasoning"
      - "innovation"
      - "development"
      - "quality_assurance"
      - "leadership"
    eligible_complexity: ["low", "medium", "high", "critical"]
    may_handle_critical_work: true
    routing_policy:
      capability_parity_target: 1.0
      comparison_peers: ["claude", "openai_codex", "cursor"]
      statement: "Route Grok as a Cursor-family primary peer by fit, independence, capacity, and evidence needs."
    contact_boundary: "The xAI API, Grok Build CLI, and Grok Bot are separate contacts; use only the capabilities and authority actually available on the assigned contact."
    non_substitution_rules:
      - "Grok cannot substitute for assignment-scoped acceptance authority."
      - "Codex Security remains an independent deterministic gate where configured."
      - "Grok cannot review or approve its own work."
      - "Capability parity does not bypass assignment scope or deterministic gates."

  antigravity:
    provider: "gemini"
    lane: "capability_routed_lane"
    contact_scope: "restricted_fixture_and_invited_debate"
    team_contract: "antigravity-team-engineering/v1; separately selected and explicitly granted; default off"
    # The following limits apply only to the retained restricted contact.
    allowed_work:
      - "explicit boilerplate"
      - "scaffolding"
      - "low-level mechanical implementation"
      - "alternate/abstract ideation"
      - "the bounded sandbox execution those need"
    artifact_status: "non_authoritative_evidence"
    cannot_perform:
      - "defining research-contract or methodology truth"
      - "merging into a protected branch"
    # Sandbox output is never complete on its own.
    mandatory_downstream_verification:
      required: true
      assignee: "independent_non_author_with_verified_integration_capability"
      rule: "Every restricted fixture work assignment must feed a later independently assigned non-author verification assignment before integration or acceptance influence."
      planner_rule: "A plan using the restricted fixture contact without that later verifying assignment is incomplete. The separate team contract retains its own admission and independent-review gates."
    outbound_work_packet:
      permitted_value_kinds:
        - "repository_owned_fixed_strings"
        - "closed_enum_values"
        - "bounded_integers"
      prohibited_value_kinds:
        - "model_authored_prose"
        - "owner_authored_prose"
        - "caller_authored_prose"
      enforcement: "mechanical_closed_vocabulary_assertion_not_review"
      failure_mode: "fail_closed_with_generic_labels"
    # Mirrored exactly from DENIED_AUTHORITIES in
    # src/director_orchestrator/antigravity.py. Every request denies all of
    # these regardless of its capability. A drift test asserts equality with the
    # runtime constant, so a broad paraphrase cannot replace the typed boundary.
    # Closed fixture payloads retain no review, acceptance, or merge authority.
    # Qualified team reviews use the separately authenticated Oracle gateway.
    denied_authorities:
      - "acceptance_verdict"
      - "billing_or_spend"
      - "branch_selection"
      - "contract_or_methodology_definition"
      - "deployment_or_publication"
      - "external_write"
      - "merge.non_protected"
      - "merge.protected"
      - "permission_or_credential_change"
      - "repository_access"
      - "repository_write"
      - "review_verdict"
    # Mirrored exactly from WITHHELD_CONTEXT in the same module: stated on the
    # wire so the receiving agent cannot mistake absence for oversight.
    withheld_context:
      - "acceptance_criteria"
      - "assignment_task_text"
      - "dependency_outcomes"
      - "owner_objective"
      - "owner_or_slack_identifiers"
      - "primary_team_handoff_context"
      - "private_project_data"
      - "repository_paths_diffs_or_source"
      - "reviewer_revision_text"
      - "run_session_or_task_identifiers"
    debate:
      seatable: true
      may_initiate: false
      reason: "Seated only by a persisted Director debate assignment, which carries the bounded question, options, and accepted prior contributions on a separate typed contract. Antigravity cannot open, self-route, widen, or autonomously continue a conversation."
      granted_authority: "none; a seat grants no review, acceptance, merge, deployment, publication, external-write, access, or methodology authority"
      voting_weight_effect: "Weight is cast only for an invited turn and stays advisory inside the immutable denominator."

  perplexity:
    role: "evidence_only_research_specialist"
    transport: "api_only"
    allowed:
      - "methodological research"
      - "theoretical research"
      - "source discovery"
      - "cross-source fact verification"
      - "user-reviewed evidence gathering"
    # Mirrored exactly from team_operating_charter()["perplexity_contract"]["prohibited"].
    # A drift test fails if any canonical prohibition is omitted or reworded.
    prohibited:
      - "private repository context or credentials"
      - "code or repository writes"
      - "approval, acceptance, or merge verdicts"
      - "committee votes"
      - "Slack or other external posts"
      - "merge, deployment, publication, or permission changes"
    excluded_responsibility_areas:
      - "programming"
    required_provenance_fields:
      - "query"
      - "result_url"
      - "page_title"
      - "publication_date"
      - "retrieval_date"
      - "supporting_excerpt_or_extracted_content"
      - "source_type"
      - "confidence"
      - "contradictions"
      - "unavailable_evidence"
    review_requirement: "OpenAI or another authorized primary-team member must evaluate Perplexity evidence before it influences a plan, implementation requirement, or acceptance decision."

  claude:
    team: "primary"
    standing_role: null
    routing_rule: "Select by verified capabilities, assignment authority, independence, availability and budget; no standing project leadership."

  openai:
    team: "primary"
    standing_role: "chatgpt_codex_director"
    leadership_authority: "owner_appointed_project_director_no_implicit_runtime_activation"
    investigator_responsibility: "OpenAI/Director team members (ChatGPT and Codex) act as INVESTIGATOR: proactively identify and document issues while other providers work, including evidence, impact, uncertainty, and suggested solutions. Do not directly remediate an investigated issue unless separately assigned that fix, and do not take over another provider's assignment. Communicate findings through the acting Director's task thread or an existing PR/issue, when the assignment authorizes communication, and track disposition with the finding. The Director relays only sanitized summaries to Slack; detailed findings and disposition stay in the existing authorized PR/issue. If none exists, retain details locally and request an authorized destination; never post them to Slack. Investigation grants no paid dispatch, scope expansion, approval, merge, or deployment authority."
    # The three canonical identities from docs/team-operating-charter.md and
    # prompts/director-system.md. Coordination, planning, and acceptance are
    # duties nested under these identities; they never replace or blur them,
    # because only the identity carries the voting boundary.
    function_separation_rule: "The configured coordinating lane keeps Moderator, Participant, and Director functions separate in every project-local record; they are never collapsed or renamed into duty buckets."
    functions:
      - id: "moderator"
        votes: false
        duties:
          - "frame the question and bounded options neutrally"
          - "request positions without leading language"
          - "prevent premature cross-exposure"
          - "run the counter-bias pass against the favored view"
        boundary: "Moderating never removes, reduces, or defers OpenAI's vote. The counter-bias pass is vote-free only so that it cannot pre-empt synthesis, where Participant casts its one vote or records an explicit abstention."
      - id: "participant"
        votes: true
        vote_count: 1
        vote_weight: 2.5
        duties:
          - "record an independently formed initial position before specialist conclusions are exposed"
          - "cast the single existing OpenAI advisory vote during synthesis or record an explicit abstention"
        boundary: "Participant records the one authenticated OpenAI position and, at synthesis, its single advisory vote at full weight or an explicit abstention. OpenAI retains its right to vote in every debate it joins, including every debate it moderates; only OpenAI's own abstention forgoes exercising it. The votes, vote_count, and vote_weight fields describe entitlement, not mandatory participation. Planning, moderation, synthesis, and acceptance earn no additional vote; that bars a second OpenAI vote and never the first."
      - id: "director"
        votes: false
        duties:
          - "plan"
          - "decompose"
          - "route"
          - "coordinate"
          - "synthesize"
          - "acceptance_review"
          - "review_handoff"
          - "milestone_reporting"
          - "investigator"
        boundary: "Director authority does not create a vote or a participation record that did not actually occur."
    participation_record_rule: "Record only actual provider responses. Never draft a missing position, convert silence into assent, or claim participation, rebuttal, confidence, or a vote that was not returned."
    preserved_boundaries:
      # See docs/contribution-attribution-policy.md#sole-author-rule.
      producer_exclusion: "Only the sole author and its provider family are barred from review or acceptance on authorship grounds; assisting contributors and co-authors may review when otherwise eligible. No contributor with counted lines may merge, whatever their label."
      material_tie_escalation: "A material cost, authority, safety, privacy, scope, runtime, or direction tie requires one owner decision; only an ordinary tie reaches documented OpenAI evidence judgment."
      deterministic_gates: "Exact-SHA review, trusted checks, budgets, allowlists, and approval gates remain mandatory where configured."
      assignment_target: "Separately assigned OpenAI production under the frozen profile; material authorship requires different-provider exact-candidate review and removes Director merge independence."

supplemental_reviewers:
  github_copilot_lite:
    provider_or_committee_member: false
    workload_percentage: null
    effort_band_percent: [0, 4]
    accounting_status: "unscored_reporting_only_no_production_credit"
    provider_adapter: "none"
    automatic_routing: false
    unavailable_action: "fail_closed_as_unavailable"
    trigger: "one requested run after required checks are green and the exact candidate is frozen"
    automatic_every_push: false
    gating: false
    authority_granted: []
    unavailable_or_quota_failure: "record as waste and continue without an inferred verdict"
    finding_rule: "independently validate; a confirmed underlying defect follows normal gates, while a rejected finding is waste"
    candidate_change_rule: "invalidate the observation without an automatic rerun"
    material_authorship_rule: "A substantive Copilot-authored fix makes Copilot a material author ineligible for independent review or acceptance of that candidate."

# Requirement of this template, restated so a reader cannot infer more from it.
this_template_does_not_change:
  - "committee voting weights or the immutable denominator"
  - "runtime permissions or allowlists"
  - "provider credentials"
  - "deployments or service state"
  - "Slack behaviour"
  - "deterministic policy in src/director_orchestrator/policy.py"

project_local_bindings:
  project_id: "<short-stable-project-id>"
  recorded_at: "<ISO-8601 timestamp>"
  lanes_in_use: []          # subset of providers above actually staffed this project
  deviations:
    - area: "<responsibility area>"
      provider: "<provider>"
      justification: "<why this project deviates from default routing>"
      owner_authorization: "<exact stored authorization or none>"

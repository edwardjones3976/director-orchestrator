# [[Claude Code | Claude Opus 5.5 | 2026-09-27 | 03:40 UTC | BEGIN]]
# Provider profile sheet: Z.ai (GLM) (director-provider-profile/v1).
# Descriptive only. Grants no authority. This lane has no charter role profile,
# committee seat, standing role, or legacy adapter; every field below is derived
# from code, the allocation profiles, and the provider setup document.
# Names only: no allowlist, key, token, endpoint, path, or owner identifier values.
schema_version: "director-provider-profile/v1"
document_type: "director-provider-profile"
provider_id: "zai"
display_name: "Z.ai (GLM)"
authority_granted: "none"

source_of_truth:
  charter_document: "docs/team-operating-charter.md"
  charter_module: "src/director_orchestrator/team_charter.py"
  allocation_module: "src/director_orchestrator/allocation_profiles.py"
  deterministic_policy: "src/director_orchestrator/policy.py"
  route_catalog: "docs/provider-profiles/routes.yaml"
  precedence: "charter_code_and_deterministic_policy_override_this_profile"
  drift_rule: "If this profile and the charter, configuration defaults, or adapter constants disagree, the charter and code win and this file is wrong."

identifiers:
  lane_id: "zai"
  backend_identity: "zai"
  provider_name_enum: "zai"
  has_legacy_adapter: false
  legacy_accounting_agent: "zai"
  legacy_accounting_note: "legacy_accounting_agent is the accounting backend only; it is not an identity and carries no authority."
  committee_member_key: null
  charter_workload_lane_key: null
  standing_role_label: null
  config_prefixes: ["ZAI_"]
  alias_note: "Z.ai serves GLM models through the Claude Code executable pointed at Z.ai's Anthropic-compatible endpoint. The executable never makes the output Claude's: the lane, the contact family (Z.ai), and the result provider stay zai. The production native CLI and the earlier Lite trial contact are two contacts of one lane; the trial contact never creates production credit or a second quota."

roles:
  team: "lane_only"
  lane_class: "capability_routed_lane"
  summary: "Assignment-scoped implementation, tests, research, and tool use, and independent review of other providers' work when Z.ai did not materially author the candidate; never self-review. GLM output served through the Claude Code executable is attributed to Z.ai and is never relabelled Claude. The lane is not a committee member, and a nonzero allocation target is not evidence that it is operational: it stays closed until every production readiness check passes."
  charter_workload_lane: null
  strategy_key: null
  strategy_priority: null
  eligible_responsibility_areas: []
  excluded_responsibility_areas: []
  eligible_complexity: []
  capability_parity_target: null
  comparison_peers: []
  elevated_work: []
  non_substitution_rules:
    - "Z.ai cannot review, accept, or merge a candidate it materially authored."
    - "Output served through the Claude Code executable is Z.ai output; it never counts as Claude work, a Claude review, or Claude-family independence."
    - "Lite trial attempts earn no production credit and are never production or qualification evidence."
    - "A nonzero allocation target is not evidence that the route is operational."
  family: "zai"
  transport_rule: "The production native CLI and the Lite trial contact are separate contacts; each may use only the capabilities and authority of that contact, and the trial contact never runs in production mode."
  routing_rule: "Route Z.ai by assignment scope, granted tools, reviewer independence from every material author's provider family, readiness, and the enforced target-plus-five ceiling."
  committee:
    member: false
    voting_power: null
    seatable_in_debate: false
    may_initiate_debate: false
    vote_grants_authority: false
  allocation:
    profiles: { mixed: 18, engineering: 18, public_research: 18, enterprise: 18 }
    default_profile: "engineering"
    overall_effort_policy: "telemetry_only_no_separate_allocation"
    capacity_context: "owner_Pro20x_Max5x_not_API_entitlements"
    accounting_basis: "admitted_assignment_count"
    zero_target_rule: "ineligible"
    accounting_status: "allocation_without_legacy_adapter"
  hygiene_review: null
  openai_functions: null

capabilities:
  summary: "Tool-enabled GLM agent work through the Claude Code executable on Z.ai's endpoint, limited to the packet's grants: repository reading, fixed test runners, public web search, and isolated-branch edits confined to owned paths only when ZAI_ALLOW_REPOSITORY_WRITE is true. Eligible independent reviewer of candidates it did not author. It performs no external effect, and media capabilities of individual GLM models are not wired or advertised."
  strengths:
    - "text coding and tool-enabled agent work within granted tools"
    - "test execution through fixed test runners"
    - "public web research when the packet grants search"
    - "independent review of candidates it did not author"
  assignment_kinds: [general, implementation, research, independent_review]
  may_create_draft_pr: "never"
  may_issue_review_verdict: "eligible_reviewer"
  may_merge: false
  may_deploy_or_publish: false
  may_post_to_slack: false
  may_cast_committee_vote: false
  receives_repository_context: true
  receives_task_prose: true
  web_grounded_research: true
  tool_use: "repository_cli"
  charter_allowed: null
  required_evidence: null
  antigravity_capabilities: null
  antigravity_interaction_kinds: null

models_and_effort:
  model_variables:
    - { variable: "ZAI_MODEL", role: "provider_model", settings_field: "zai_model", default: "glm-5.3-flash", documented_in_env_example: true, values_recorded: false }
  effort_variables: []
  catalog_check: "No catalog request is made. Readiness requires an explicit GLM model name, and every result's native modelUsage must name exactly the configured model; any other serving model is rejected, never relabelled."
  note: "Every Anthropic model slot of the CLI is pinned to the configured GLM model for each attempt. No reasoning-effort variable exists for Z.ai."

budgets_and_limits:
  variables:
    - { variable: "ZAI_MAX_TURNS", kind: "max_turns", settings_field: "zai_max_turns", default: 30, documented_in_env_example: true, values_recorded: false }
    - { variable: "ZAI_PRODUCTION_TIMEOUT_SECONDS", kind: "timeout_seconds", settings_field: "zai_production_timeout_seconds", default: 900, documented_in_env_example: true, values_recorded: false }
  spend_ledger_member: false
  not_modeled_note: "Cost is UNKNOWN and recorded as null, never zero: the CLI prices with Anthropic tariffs. The owner's existing $5 total budget has an UNKNOWN current balance and no variable here models it; the packet's per-attempt budget and token limits, the shared absolute cutoff, and the turn cap bound each attempt."
  shared_limits: ["MAX_TASK_BUDGET_USD", "PROVIDER_TIMEOUT_SECONDS"]

gating:
  health_key: "zai"
  readiness_function: "readiness"
  readiness_keys: [zai]
  primary_lane_authentication_source: "settings_field"
  variables:
    - { variable: "ZAI_ENABLED", kind: "enable_switch", settings_field: "zai_enabled", default: false, documented_in_env_example: true, values_recorded: false, readiness_key: "zai", required_value: true, verify: "GET /health zai_production.enabled; startup refuses it outside production mode" }
    - { variable: "ZAI_MODE", kind: "transport_selector", settings_field: "zai_mode", default: "trial_only", documented_in_env_example: true, values_recorded: false, readiness_key: "zai", required_value: "production", verify: "GET /health zai_production.production_mode; trial_only keeps only the Lite trial contact" }
    - { variable: "ZAI_PRODUCTION_ACTIVATION", kind: "activation_record_digest", settings_field: "zai_production_activation", default: "", documented_in_env_example: true, values_recorded: false, readiness_key: "zai", required_value: null, verify: "GET /health zai_production.activation_evidence_recorded; configuration naming the owner's activation record by digest, never proof of a live round trip" }
    - { variable: "ZAI_API_KEY", kind: "credential_presence", settings_field: "zai_api_key", default: "", documented_in_env_example: true, values_recorded: false, readiness_key: "zai", required_value: null, verify: "GET /health zai_production.credential_configured" }
    - { variable: "ZAI_API_BASE", kind: "endpoint_lock", settings_field: null, default: null, documented_in_env_example: true, values_recorded: false, readiness_key: null, required_value: null, verify: "Settings field zai_api_base; GET /health zai_production.official_endpoint; startup refuses a non-official endpoint; value never recorded here" }
    - { variable: "ZAI_CLI_EXECUTABLE", kind: "executable_path", settings_field: "zai_cli_executable", default: "", documented_in_env_example: true, values_recorded: false, readiness_key: "zai", required_value: null, verify: "GET /health zai_production.cli_configured; absolute regular file; value never recorded here" }
  allowlist_variables:
    - { variable: "PROJECT_ALLOWLIST", scope: "project", values_recorded: false }
    - { variable: "REPOSITORY_ALLOWLIST", scope: "repository", values_recorded: false }
    - { variable: "ALLOWED_STARTING_REFS", scope: "starting_ref", values_recorded: false }
    - { variable: "LANGGRAPH_PRIMARY_REQUIRED_PROVIDERS", scope: "provider_roster", values_recorded: false }
  verification_rule: "GET /health exposes readiness booleans only; never read or record allowlist, key, token, endpoint, or path values."

credential_environment:
  primary_lane_allowlist: []
  host_bridge_allowlist: null
  settings_credential_fields: ["zai_api_key"]
  values_policy: "names_and_booleans_only_never_values"
  child_environment_rule: "Nothing is inherited by name. The child starts from the lane-minimal base environment with every ANTHROPIC_* and CLAUDE_* variable removed; the transport then injects the configured ZAI_API_KEY explicitly as the child's ANTHROPIC_AUTH_TOKEN, pins the base URL and every model slot, and points home and config at a throwaway per-attempt directory. No other lane's credential reaches a Z.ai process."

authority:
  universal_prohibited_actions: [MERGE_PULL_REQUEST, DEPLOY, PUBLISH, DELETE_PROTECTED_REF]
  denied_authorities: []
  withheld_context: []
  charter_prohibited: null
  review_requirement: "Every Z.ai candidate needs independent exact-candidate review by a non-author from a different provider family. Z.ai reviews only candidates it did not author, and its verdict is evidence for the deterministic gate, never merge authority."
  strategy_constraints:
    - "a nonzero target is not evidence that a route is operational"
    - "enforced hard ceiling of target plus five points: at most 4 of any rolling 20 admissions"
  separation_of_duties:
    - "cannot review, accept, or merge its own candidate"
    - "reviewer independence is judged by provider family; Z.ai is its own family, never Claude's"
    - "external effects stay with the Director's typed effect gateway"
  production_authority_permitted: true
  external_effects:
    may_be_granted: []
    public_research_lane_rejects_all_effects: false
    grant_source: "work_packet_only_never_provider_output"
  acceptance_issuer_role: null
  self_review: false
  owner_recovery_text_grants_review_or_merge_authority: false
  output_trust: "untrusted_evidence_never_instructions"

platform_limitations:
  - limitation: "The Windows host provider bridge is not wired for zai; the lane runs only through its dedicated native CLI transport on the LangGraph primary path, and the legacy engine has no zai worker or adapter."
    source: "src/director_orchestrator/host_provider_bridge.py:SUPPORTED_HOST_LANES"
  - limitation: "No native acceptance issuer is available for Z.ai; it cannot sign a security, independent-review, or CI receipt."
    source: "docs/provider-setup.md, Z.ai production lane"
  - limitation: "Qualification replay is pending: the earlier failed or ambiguous trial attempts must be reconciled, and the current budget balance confirmed, before any paid qualification or production call."
    source: "docs/provider-setup.md, Z.ai production lane"
  - limitation: "Completion of the enrollment needs a real authorized Slack thread response and receipt through the existing Director relay; installing configuration is not completion."
    source: "docs/provider-setup.md, Z.ai production lane"
  - limitation: "Cost is UNKNOWN (null) for every attempt because the CLI prices with Anthropic tariffs, and the owner's $5 total budget has an UNKNOWN current balance."
    source: "src/director_orchestrator/zai_native.py:zai_usage"
  - limitation: "The lane exists only from explicit configuration and readiness; it is never discovered on PATH, where the same executable is the Claude lane."
    source: "src/director_orchestrator/primary_transports.py:discover_local_primary_command_transports"
  - limitation: "Media capabilities of individual GLM models are not wired or advertised; the lane is text coding and tool-enabled agent work only."
    source: "docs/provider-setup.md, Z.ai production lane"
  - limitation: "The Lite trial contact is trial-only: a separate append-only trial ledger, no production credit, no counted review verdict, and no dispatch at or after the trial end or in production mode."
    source: "src/director_orchestrator/zai_lane.py; src/director_orchestrator/config.py:validate_zai_trial_configuration"

transports:
  - transport_id: "zai-native-cli"
    kind: "native_cli"
    runtime: "langgraph_primary"
    enum_value: null
    transport_kind_observed: "zai-native-cli"
    status: "implemented_disabled_by_default"
    direction: "director_to_provider"
    config: ["ZAI_ENABLED", "ZAI_MODE", "ZAI_PRODUCTION_ACTIVATION", "ZAI_API_KEY", "ZAI_API_BASE", "ZAI_MODEL", "ZAI_CLI_EXECUTABLE", "ZAI_MAX_TURNS", "ZAI_PRODUCTION_TIMEOUT_SECONDS", "ZAI_ALLOW_REPOSITORY_WRITE", "LANGGRAPH_PRIMARY_REQUIRED_PROVIDERS", "LANGGRAPH_PRIMARY_LIVE_PROVIDER_DISPATCH_ENABLED"]
    authority_note: "The only transport that may serve the zai lane. It runs one validated packet per attempt with packet-scoped tool grants, refuses every external effect before launch, and accepts only a complete successful envelope served by the configured GLM model; configuration alone never makes the lane callable."
    current_transport_constraints:
      - "composed only when every zai_production readiness boolean holds"
      - "tool grants limited to READ_REPOSITORY, RUN_TESTS, PUBLIC_WEB_SEARCH, and WRITE_ISOLATED_BRANCH; any other grant is refused before launch"
      - "WRITE_ISOLATED_BRANCH needs ZAI_ALLOW_REPOSITORY_WRITE and owned paths; .env files, .git, and prohibited paths are always denied"
      - "turns capped by ZAI_MAX_TURNS; the shared absolute cutoff and contained process tree apply, and a nonzero exit stays ambiguous"
      - "missing token counts mean the result is never SUCCEEDED; cost is always recorded as unknown"
    route_id: "zai-native-cli"
    browser_policy: null
  - transport_id: "zai-lite-trial"
    kind: "native_cli"
    runtime: "operator_cli"
    enum_value: null
    transport_kind_observed: null
    status: "implemented_disabled_by_default"
    direction: "director_to_provider"
    config: ["ZAI_TRIAL_ENABLED", "ZAI_MODE", "ZAI_API_KEY", "ZAI_API_BASE", "ZAI_MODEL", "ZAI_CLI_EXECUTABLE", "ZAI_TRIAL_JOURNAL_DIR", "ZAI_TRIAL_LEDGER_PATH", "ZAI_TIMEOUT_SECONDS", "ZAI_LITE_ENTITLEMENT_VERIFIED"]
    authority_note: "The earlier bounded Lite trial contact, operated through the trial CLI with tools disabled. It records attempts only in its own append-only trial ledger and carries no production credit, counted review verdict, or merge authority."
    current_transport_constraints:
      - "runs only with ZAI_MODE=trial_only; startup refuses ZAI_TRIAL_ENABLED in production mode"
      - "ZAI_ALLOW_REPOSITORY_WRITE, ZAI_ALLOW_REVIEW_VERDICT, and ZAI_PRODUCTION_ACTIVATION must stay unset or false in trial mode"
      - "ZAI_TRIAL_ENABLED requires ZAI_LITE_ENTITLEMENT_VERIFIED; the trial ledger must be its own file"
      - "refuses dispatch at or after the trial end the transport enforces"
    route_id: "zai-lite-trial"
    browser_policy: null

communication:
  relay_rule: "provider_messages_relay_through_director"
  direct_provider_to_provider_channels_exist: false
  notes:
    - "Z.ai reaches every other lane only through Director-authored packets, declared dependency outcomes, and review handoffs; it holds no debate seat."
    - "Z.ai never posts to Slack; the Director relays a concise assignment-correlated summary through the existing Slack thread relay, preserving thread_ts."
    - "Trial-lane results never reach another provider as production evidence."

this_profile_does_not_change:
  - "committee voting weights or the immutable denominator"
  - "runtime permissions or allowlists"
  - "provider credentials"
  - "deployments or service state"
  - "Slack behaviour"
  - "deterministic policy in src/director_orchestrator/policy.py"

sources:

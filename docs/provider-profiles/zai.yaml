    anchor: "The owner enrolled Z.ai (GLM Coding Plan) as its own production lane `zai` on"
  - document: "docs/provider-setup.md"
    anchor: "and are never relabelled Claude."
  - document: "docs/provider-allocation-profiles.md"
    anchor: "### Z.ai production enrollment (2026-09-27)"
  - document: "docs/templates/project-bootstrap/provider-roles-contract.yaml"
    anchor: "hard_ceiling_enforced_lanes: [zai]"
  - document: "docs/providers/zai-welcome-aboard.md"

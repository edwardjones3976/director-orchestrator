name: Contribution attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: contribution-attribution-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contribution-attribution:
    name: Contribution attribution
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changed files and submission envelope
        run: >-
          python scripts/check_contribution_tags.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-event "$GITHUB_EVENT_PATH"

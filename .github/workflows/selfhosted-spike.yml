# Throwaway spike (not for merge): proves whether self-hosted runners execute
# jobs while GitHub-hosted Actions are refused for billing.
name: Self-hosted spike
on:
  push:
    branches: [claude/ci-selfhosted-spike-20260923]
jobs:
  linux:
    runs-on: [self-hosted, Linux, director]
    steps:
      - run: uname -srm && python3.12 --version && docker version --format '{{.Server.Version}}'
  windows:
    runs-on: [self-hosted, Windows, director]
    steps:
      - shell: powershell
        run: $PSVersionTable.PSVersion.ToString(); [Environment]::OSVersion.VersionString

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access to the repo.
permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the Dockerfile base image, so CI exercises the runtime we ship.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo has already had one credential exposure. Fail loudly if a real
      # .env, a database, or a virtualenv is ever committed, rather than relying
      # on .gitignore being correct at the moment someone runs `git add`.
      - name: Assert no secret-bearing files are tracked
        run: |
          tracked=$(git ls-files -- '.env' '.env.*' '*.db' '*.sqlite3' '.venv/**' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing or generated files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret-bearing files are tracked."

name: CI

# Runner routing (owner decision 2026-09-23). GitHub-hosted runners are the
# default. When the repository variable DIRECTOR_CI_RUNNER is "self-hosted",
# every job runs on the owner's registered runners (labels: self-hosted + OS +
# director) under the SAME job and check names, so the acceptance contracts
# that pin this workflow path and these check names keep working.
#
# Security boundary: repository configuration, not this file. A pull request
# can edit ci.yml, so no condition here can keep candidate code off the owner's
# runners. The fork condition in each runs-on is defense in depth only. What
# keeps untrusted code off these runners is configuration a pull request cannot
# change: the repository is private, and its Actions setting
# run_workflows_from_fork_pull_requests is false, so fork pull requests run no
# workflow at all (verified 2026-09-23). Only accounts with write access can push
# the branches that run here. Do not enable fork pull request workflows, or make
# the repository public, while DIRECTOR_CI_RUNNER is "self-hosted".
#
# Steps that only a hosted image needs are guarded with
# runner.environment == 'github-hosted'; their self-hosted replacements with
# runner.environment == 'self-hosted'.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# The self-hosted pool is one runner per OS, so a superseded pull request run is
# cancelled instead of queued. Main pushes get unique groups and queue for
# runner capacity without cancelling each other (including pending runs).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The first PR run and every uncertain update use all jobs. Only a direct
  # base-merge update after a green full run can select mapped focused tests.
  scope:
    name: CI scope
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","director"]') || 'ubuntu-latest' }}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      suite: ${{ steps.plan.outputs.suite }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        if: runner.environment == 'self-hosted'
        with:
          python-version: "3.12"
      - name: Prove focused scope or choose full suite
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_scope.py plan

  changes:
    name: Documentation changes
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","director"]') || 'ubuntu-latest' }}
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python scripts/run-tests-parallel.py --docs-only "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  contribution-attribution:
    name: Contribution attribution
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","director"]') || 'ubuntu-latest' }}
    env:
      PYTHONPATH: src
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Self-hosted Linux has no bare `python`; ubuntu-latest does.
      - uses: actions/setup-python@v6
        if: runner.environment == 'self-hosted'
        with:
          python-version: "3.12"
      - name: Validate changed files and submission envelope
        run: >-
          python scripts/check_contribution_tags.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-event "$GITHUB_EVENT_PATH"

  # [[OpenAI Codex | GPT-5.6 | 2026-09-01 | 11:15 UTC | BEGIN]]
  python:
    # matrix.os stays the hosted label on self-hosted runners too: it is part of
    # the pinned check name.
    name: Python 3.12 (${{ matrix.os }})
    needs: scope
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(matrix.self_hosted) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The self-hosted Linux and Windows runners share one 32-CPU host, so Windows gets fewer shards.
        include:
          - os: ubuntu-latest
            shards: 8
            self_hosted: '["self-hosted","Linux","director"]'
          - os: windows-latest
            shards: 4
            self_hosted: '["self-hosted","Windows","director"]'
    env:
      PYTHONPATH: src
      # Windows: per-process long-path support (no global git config change).
      DIRECTOR_TEST_SHARDS: ${{ vars.DIRECTOR_TEST_SHARDS || matrix.shards }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          # The canonical-document migration verifies original Git blob digests.
          fetch-depth: 0
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }
      # On self-hosted Windows, setup-python's installer writes HKLM, which
      # needs admin; the Windows step below uses the host interpreter instead.
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted' || runner.os == 'Linux'
        with:
          python-version: "3.12"
          cache: pip
      # Self-hosted: install requirements into a job-local venv, never into the
      # shared tool-cache or host interpreter. RUNNER_TEMP is emptied per job.
      - name: Provide job-local Python 3.12 venv (self-hosted Linux)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --clear "$RUNNER_TEMP/ci-py312"
          echo "$RUNNER_TEMP/ci-py312/bin" >> "$GITHUB_PATH"
      # The explicit path avoids the WindowsApps aliases, which the runner
      # cannot stat.
      - name: Provide job-local Python 3.12 venv (self-hosted Windows)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:LOCALAPPDATA 'Python\pythoncore-3.12-64\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "Host CPython 3.12 not found at $python" }
          $venv = Join-Path $env:RUNNER_TEMP 'ci-py312'
          & $python -m venv --clear $venv
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          Join-Path $venv 'Scripts' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Hosted images ship Node.js; the n8n status-code tests need it.
      - uses: actions/setup-node@v5
        if: runner.environment == 'self-hosted' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        with:
          node-version: "20"
          package-manager-cache: false
      # Hosted Ubuntu ships PowerShell 7; the self-hosted WSL runner has no
      # passwordless sudo, so install a pinned, hash-verified release into the
      # tool cache instead.
      - name: Provide PowerShell 7 (self-hosted Linux, pinned, no sudo)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux' && ((needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused') || needs.scope.outputs.suite == 'policy')
        shell: bash
        run: |
          set -euo pipefail
          version=7.6.6
          sha=ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc
          dest="${RUNNER_TOOL_CACHE}/pwsh/${version}"
          if [ ! -x "$dest/pwsh" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/pwsh.tgz" "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
            echo "${sha}  $tmp/pwsh.tgz" | sha256sum -c -
            mkdir -p "$dest"
            tar -xzf "$tmp/pwsh.tgz" -C "$dest"
            chmod +x "$dest/pwsh"
            rm -rf "$tmp"
          fi
          echo "$dest" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL (Linux)
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: bash
        run: |
          set -euo pipefail
          container="director-primary-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:55433:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_USER=director_ci \
            --env POSTGRES_DB=director_test \
            postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U director_ci -d director_test >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Disposable PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          echo "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:55433/director_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL (Windows)
        if: runner.environment == 'github-hosted' && runner.os == 'Windows' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $initdb = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $initdb) {
            $installPassword = [guid]::NewGuid().ToString('N')
            choco install postgresql17 --yes --no-progress --params "/Password:$installPassword"
            $initdb = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          $bin = $initdb.Directory.FullName
          $data = Join-Path $env:RUNNER_TEMP 'director-primary-postgres'
          & (Join-Path $bin 'initdb.exe') -D $data -U director_ci --auth=trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & (Join-Path $bin 'pg_ctl.exe') -D $data -o '-p 55433 -h 127.0.0.1' -w start
          if ($LASTEXITCODE -ne 0) { throw 'pg_ctl start failed' }
          & (Join-Path $bin 'createdb.exe') -h 127.0.0.1 -p 55433 -U director_ci director_test
          if ($LASTEXITCODE -ne 0) { throw 'createdb failed' }
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:55433/director_test?sslmode=disable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DIRECTOR_PRIMARY_CI_PGDATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # AGENTS.md "Postgres-backed unit tests": on the owner's Docker Desktop
      # host the test database comes ONLY from scripts/windows-postgres-test-lane.ps1
      # (pinned image, labeled container, refuses ports it does not own). Both
      # self-hosted runners share that host, so each run gets its own container
      # name and port. The ports sit below 49152: Windows reserves blocks of its
      # dynamic range (49152+) for Hyper-V/WSL at boot, and a publish into a
      # reserved block is refused. The tests use the container's own client
      # tools through LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER (no sudo, so no
      # apt-installed postgresql-client). Linux runs the lane under the pinned
      # pwsh; Windows under Windows PowerShell 5.1, which the lane supports.
      - name: Start disposable PostgreSQL (self-hosted Linux, test lane)
        if: runner.environment == 'self-hosted' && runner.os == 'Linux' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 47000 + ([int64]$env:GITHUB_RUN_ID % 900)
          $name = "director-ci-pg-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-linux"
          & ./scripts/windows-postgres-test-lane.ps1 -Action Start -ContainerName $name -HostPort $port
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:$port/director_test?sslmode=disable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER=$name" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIRECTOR_CI_PG_LANE=$name|$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Start disposable PostgreSQL (self-hosted Windows, test lane)
        if: runner.environment == 'self-hosted' && runner.os == 'Windows' && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 48000 + ([int64]$env:GITHUB_RUN_ID % 900)
          $name = "director-ci-pg-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-windows"
          & ./scripts/windows-postgres-test-lane.ps1 -Action Start -ContainerName $name -HostPort $port
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:$port/director_test?sslmode=disable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER=$name" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIRECTOR_CI_PG_LANE=$name|$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python scripts/run-tests-parallel.py
        if: (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused') && (runner.environment == 'github-hosted' || runner.os == 'Windows')
        env:
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
      # WSL appends Windows directories to PATH; hosted Ubuntu has none, so
      # drop them for the test process. The WSL host's `docker` is a shim to
      # the Windows docker.exe, and WSL forwards to Windows processes only the
      # environment variables named in WSLENV (/p translates a path). Forward
      # the ones the compose-rendering test sets, so compose sees them.
      - name: python scripts/run-tests-parallel.py
        if: (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused') && runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        env:
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
          WSLENV: DIRECTOR_ENV_FILE/p:DIRECTOR_RUNTIME_IMAGE:DIRECTOR_RUNTIME_IMAGE_ID:DIRECTOR_COMPOSE_PROJECT_NAME:DIRECTOR_ASGI_APP:ALLOW_PAID_RUNS:LANGGRAPH_PRIMARY_ENABLED:LANGGRAPH_PRIMARY_NEW_INTAKE_ENABLED:LANGGRAPH_PRIMARY_LIVE_PROVIDER_DISPATCH_ENABLED:LANGGRAPH_PRIMARY_OFFLINE_SIMULATION_ENABLED:LANGGRAPH_PARALLEL_KILL_SWITCH
        run: |
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/mnt/' | paste -sd: -)"
          export PATH
          python scripts/run-tests-parallel.py
      - name: Run focused tests
        if: (needs.scope.result == 'success' && needs.scope.outputs.mode == 'focused') && (runner.environment == 'github-hosted' || runner.os == 'Windows')
        env:
          CI_FOCUSED_SUITE: ${{ needs.scope.outputs.suite }}
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
        run: python scripts/ci_scope.py run
      - name: Run focused tests (self-hosted Linux)
        if: (needs.scope.result == 'success' && needs.scope.outputs.mode == 'focused') && runner.environment == 'self-hosted' && runner.os == 'Linux'
        shell: bash
        env:
          CI_FOCUSED_SUITE: ${{ needs.scope.outputs.suite }}
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
          WSLENV: DIRECTOR_ENV_FILE/p:DIRECTOR_RUNTIME_IMAGE:DIRECTOR_RUNTIME_IMAGE_ID:DIRECTOR_COMPOSE_PROJECT_NAME:DIRECTOR_ASGI_APP:ALLOW_PAID_RUNS:LANGGRAPH_PRIMARY_ENABLED:LANGGRAPH_PRIMARY_NEW_INTAKE_ENABLED:LANGGRAPH_PRIMARY_LIVE_PROVIDER_DISPATCH_ENABLED:LANGGRAPH_PRIMARY_OFFLINE_SIMULATION_ENABLED:LANGGRAPH_PARALLEL_KILL_SWITCH
        run: |
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/mnt/' | paste -sd: -)"
          export PATH
          python scripts/ci_scope.py run
      - name: Print compose-render diagnostic (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        shell: python
        run: |
          from pathlib import Path
          import os
          path = Path(os.environ["RUNNER_TEMP"]) / "compose-render-diagnostic.txt"
          if path.is_file():
              print(path.read_text(encoding="utf-8"), end="")
      - run: python -m compileall -q src scripts tests
        if: (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - name: Validate canonical HTML documentation
        run: python scripts/check_html_documentation.py
      - run: python -m json.tool n8n/workflows/director-intake.json
        if: (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - run: python -m json.tool docs/oracle-review-artifact.example.json
        if: (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - name: Stop disposable PostgreSQL (Linux)
        if: always() && runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "${LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER:-}" ]; then
            docker rm --force "$LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER" >/dev/null 2>&1 || true
          fi
      - name: Stop disposable PostgreSQL (Windows)
        if: always() && runner.environment == 'github-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:DIRECTOR_PRIMARY_CI_PGDATA) {
            $pgCtl = Get-Command pg_ctl.exe -ErrorAction SilentlyContinue
            if ($pgCtl) {
              & $pgCtl.Source -D $env:DIRECTOR_PRIMARY_CI_PGDATA -m fast -w stop
            }
          }
      - name: Stop disposable PostgreSQL (self-hosted Linux, test lane)
        if: always() && runner.environment == 'self-hosted' && runner.os == 'Linux' && env.DIRECTOR_CI_PG_LANE != ''
        shell: pwsh
        run: |
          if ($env:DIRECTOR_CI_PG_LANE) {
            $name, $port = $env:DIRECTOR_CI_PG_LANE -split '\|', 2
            & ./scripts/windows-postgres-test-lane.ps1 -Action Stop -ContainerName $name -HostPort ([int]$port)
          }
      - name: Stop disposable PostgreSQL (self-hosted Windows, test lane)
        if: always() && runner.environment == 'self-hosted' && runner.os == 'Windows' && env.DIRECTOR_CI_PG_LANE != ''
        shell: powershell
        run: |
          if ($env:DIRECTOR_CI_PG_LANE) {
            $name, $port = $env:DIRECTOR_CI_PG_LANE -split '\|', 2
            & ./scripts/windows-postgres-test-lane.ps1 -Action Stop -ContainerName $name -HostPort ([int]$port)
          }
  # [[OpenAI Codex | GPT-5.6 | 2026-09-01 | 11:15 UTC | END]]

  containers:
    name: Compose and container build
    needs: [changes, scope]
    if: ${{ always() && !cancelled() }}
    # Self-hosted: Docker Compose is reliable on the Windows host, not through
    # the WSL docker.exe shim.
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Windows","director"]') || 'ubuntu-latest' }}
    env:
      DIRECTOR_ENV_FILE: .env.example
    steps:
      - name: Docs-only no-op
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          echo "docs-only: Compose and container build not applicable; succeeded as a no-op"
      - uses: actions/checkout@v5
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
      # The owner's host runs live Director stacks; a per-run project name keeps
      # the build from retagging any stack's image.
      - name: Use a per-run compose project (self-hosted)
        if: runner.environment == 'self-hosted' && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: powershell
        run: |
          "DIRECTOR_COMPOSE_PROJECT_NAME=director-ci-$($env:GITHUB_RUN_ID)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: docker compose --env-file .env.example config --quiet
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - name: Validate isolated Project Uppercut profile
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        env:
          DIRECTOR_ENV_FILE: .env.uppercut.example
          DIRECTOR_COMPOSE_PROJECT_NAME: project-uppercut-director-ci
        run: docker compose --env-file .env.uppercut.example config --quiet
      - name: Validate isolated Edge Oracle profile
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        env:
          DIRECTOR_ENV_FILE: .env.edge-oracle.example
          DIRECTOR_COMPOSE_PROJECT_NAME: edge-oracle-director-ci
        run: docker compose --env-file .env.edge-oracle.example config --quiet
      - run: docker compose --env-file .env.example build orchestrator
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - name: Record focused container scope
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result == 'success' && needs.scope.outputs.mode == 'focused')
        run: echo "Container inputs unchanged; full build succeeded on the previous PR head."
      - name: Remove the per-run image (self-hosted)
        if: always() && runner.environment == 'self-hosted' && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: powershell
        run: |
          & docker image rm --force "director-ci-$($env:GITHUB_RUN_ID)-orchestrator" 2>$null | Out-Null
          exit 0

  secret-hygiene:
    name: Secret hygiene
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","director"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert no secret-bearing files are committed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env(\..+)?|[^/]+\.(db|sqlite3))$|(^|/)\.venv/'
          allowed='(^|/)\.env(\.[^/]+)?\.example$'

          candidates=$(git ls-files)
          if [ -n "$BASE_SHA" ]; then
            added=$(git log --diff-filter=A --name-only --pretty=format: "$BASE_SHA..HEAD")
            candidates=$(printf '%s\n%s\n' "$candidates" "$added")
          fi

          offenders=$(printf '%s\n' "$candidates" | sed '/^$/d' | sort -u \
            | grep -E "$forbidden" | grep -vE "$allowed" || true)

          if [ -n "$offenders" ]; then
            echo "::error::Secret-bearing or generated files are committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No secret-bearing files are committed."
      - name: Reject credential-shaped committed content
        shell: bash
        run: |
          set -euo pipefail
          pattern='gh[oprsu]_[A-Za-z0-9_]{30,}|((^|[^A-Za-z0-9_-])sk-ant-[A-Za-z0-9_-]{20,})|((^|[^A-Za-z0-9_-])sk-[A-Za-z0-9_-]{30,})|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          matches=$(git grep -l -E "$pattern" -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$matches" ]; then
            echo "::error::Credential-shaped content found in committed files."
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No credential-shaped content was found."

  recovery-probe:
    name: Cross-process recovery probe
    needs: [changes, scope]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ vars.DIRECTOR_CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","director"]') || 'ubuntu-latest' }}
    env:
      PYTHONPATH: src
    steps:
      - name: Docs-only no-op
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          echo "docs-only: Cross-process recovery probe not applicable; succeeded as a no-op"
      - uses: actions/checkout@v5
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true' }}
      - uses: actions/setup-python@v6
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        with:
          python-version: "3.12"
          cache: pip
      - name: Provide job-local Python 3.12 venv (self-hosted)
        if: runner.environment == 'self-hosted' && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: bash
        run: |
          set -euo pipefail
          python -m venv --clear "$RUNNER_TEMP/ci-py312"
          echo "$RUNNER_TEMP/ci-py312/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
      - name: Recover persisted work without redispatch
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result != 'success' || needs.scope.outputs.mode != 'focused')
        shell: bash
        run: |
          database="${RUNNER_TEMP}/director-recovery-ci.sqlite3"
          python scripts/recovery_probe.py seed --database "$database"
          python scripts/recovery_probe.py resume --database "$database"
          python scripts/recovery_probe.py resume --database "$database"
          substituted_database="${RUNNER_TEMP}/director-recovery-substituted-ci.sqlite3"
          python scripts/recovery_probe.py seed --database "$substituted_database"
          python scripts/recovery_probe.py resume-substituted-identity --database "$substituted_database"
      - name: Record focused recovery scope
        if: (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') && (needs.scope.result == 'success' && needs.scope.outputs.mode == 'focused')
        run: echo "Recovery inputs unchanged; full probe succeeded on the previous PR head."

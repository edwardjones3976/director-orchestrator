name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
      SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m json.tool n8n/workflows/director-intake.json

  containers:
    name: Compose and container build
    runs-on: ubuntu-latest
    env:
      DIRECTOR_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build orchestrator

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo has already had one credential exposure. Fail loudly if a real
      # .env, a database, or a virtualenv is ever committed, rather than relying
      # on .gitignore being correct at the moment someone runs `git add`.
      - name: Assert no secret-bearing files are tracked
        run: |
          tracked=$(git ls-files -- '.env' '.env.*' '*.db' '*.sqlite3' '.venv/**' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret-bearing or generated files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret-bearing files are tracked."

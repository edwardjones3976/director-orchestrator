name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  contribution-attribution:
    name: Contribution attribution
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed files and submission envelope
        run: >-
          python scripts/check_contribution_tags.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-event "$GITHUB_EVENT_PATH"

  # [[OpenAI Codex | GPT-5.6 | 2026-09-01 | 11:15 UTC | BEGIN]]
  python:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start disposable PostgreSQL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          container="director-primary-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:55433:5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_USER=director_ci \
            --env POSTGRES_DB=director_test \
            postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U director_ci -d director_test >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Disposable PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          echo "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:55433/director_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $initdb = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $initdb) {
            $installPassword = [guid]::NewGuid().ToString('N')
            choco install postgresql17 --yes --no-progress --params "/Password:$installPassword"
            $initdb = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          $bin = $initdb.Directory.FullName
          $data = Join-Path $env:RUNNER_TEMP 'director-primary-postgres'
          & (Join-Path $bin 'initdb.exe') -D $data -U director_ci --auth=trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & (Join-Path $bin 'pg_ctl.exe') -D $data -o '-p 55433 -h 127.0.0.1' -w start
          if ($LASTEXITCODE -ne 0) { throw 'pg_ctl start failed' }
          & (Join-Path $bin 'createdb.exe') -h 127.0.0.1 -p 55433 -U director_ci director_test
          if ($LASTEXITCODE -ne 0) { throw 'createdb failed' }
          "LANGGRAPH_RUNTIME_POSTGRES_TEST_DSN=postgresql://director_ci@127.0.0.1:55433/director_test?sslmode=disable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DIRECTOR_PRIMARY_CI_PGDATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - name: Prepare Windows Compose CLI
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import shutil
          import time
          from director_orchestrator.bounded_process import run_bounded_process

          docker = shutil.which("docker")
          if docker is None:
              raise SystemExit("Docker CLI is required for Windows Compose rendering")
          root = Path.cwd()
          environment = dict(os.environ, DIRECTOR_ENV_FILE=str(root / ".env.example"))
          started = time.monotonic()
          deadline = started + 90
          # Initialize the CLI/plugin once, without a daemon request or containers.
          # The rendering test retains its separate 30-second timeout and assertions.
          commands = (
              ("Docker version", (docker, "--version")),
              ("Compose version", (docker, "compose", "version", "--short")),
              ("Compose render", (docker, "compose", "--env-file", str(root / ".env.example"), "config", "--quiet")),
          )
          for label, argv in commands:
              code, expired, overflow, stdout, _stderr = run_bounded_process(
                  argv, cwd=root, environment=environment, timeout_seconds=90,
                  deadline=deadline, output_limit_bytes=65536, cleanup_timeout_seconds=5,
              )
              elapsed = time.monotonic() - started
              if code != 0 or expired or overflow:
                  raise SystemExit(f"{label} failed: exit={code}, timeout={expired}, overflow={overflow}, elapsed={elapsed:.3f}s")
              # Never print rendered environment or stderr containing interpolated data.
              if label.endswith("version"):
                  print(f"{label}: {stdout.decode('utf-8', errors='replace').strip()}", flush=True)
              print(f"{label} completed; elapsed={elapsed:.3f}s", flush=True)
      - run: python -m unittest discover -s tests -v
        env:
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
      - run: python -m compileall -q src scripts tests
      - run: python -m json.tool n8n/workflows/director-intake.json
      - run: python -m json.tool docs/oracle-review-artifact.example.json
      - name: Stop disposable PostgreSQL (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "${LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER:-}" ]; then
            docker rm --force "$LANGGRAPH_RUNTIME_POSTGRES_TEST_CONTAINER" >/dev/null 2>&1 || true
          fi
      - name: Stop disposable PostgreSQL (Windows)
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:DIRECTOR_PRIMARY_CI_PGDATA) {
            $pgCtl = Get-Command pg_ctl.exe -ErrorAction SilentlyContinue
            if ($pgCtl) {
              & $pgCtl.Source -D $env:DIRECTOR_PRIMARY_CI_PGDATA -m fast -w stop
            }
          }
  # [[OpenAI Codex | GPT-5.6 | 2026-09-01 | 11:15 UTC | END]]

  containers:
    name: Compose and container build
    runs-on: ubuntu-latest
    env:
      DIRECTOR_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - name: Validate isolated Project Uppercut profile
        env:
          DIRECTOR_ENV_FILE: .env.uppercut.example
          DIRECTOR_COMPOSE_PROJECT_NAME: project-uppercut-director-ci
        run: docker compose --env-file .env.uppercut.example config --quiet
      - name: Validate isolated Edge Oracle profile
        env:
          DIRECTOR_ENV_FILE: .env.edge-oracle.example
          DIRECTOR_COMPOSE_PROJECT_NAME: edge-oracle-director-ci
        run: docker compose --env-file .env.edge-oracle.example config --quiet
      - run: docker compose --env-file .env.example build orchestrator

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert no secret-bearing files are committed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env(\..+)?|[^/]+\.(db|sqlite3))$|(^|/)\.venv/'
          allowed='(^|/)\.env(\.[^/]+)?\.example$'

          candidates=$(git ls-files)
          if [ -n "$BASE_SHA" ]; then
            added=$(git log --diff-filter=A --name-only --pretty=format: "$BASE_SHA..HEAD")
            candidates=$(printf '%s\n%s\n' "$candidates" "$added")
          fi

          offenders=$(printf '%s\n' "$candidates" | sed '/^$/d' | sort -u \
            | grep -E "$forbidden" | grep -vE "$allowed" || true)

          if [ -n "$offenders" ]; then
            echo "::error::Secret-bearing or generated files are committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No secret-bearing files are committed."
      - name: Reject credential-shaped committed content
        shell: bash
        run: |
          set -euo pipefail
          pattern='gh[oprsu]_[A-Za-z0-9_]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          matches=$(git grep -l -E "$pattern" -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$matches" ]; then
            echo "::error::Credential-shaped content found in committed files."
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No credential-shaped content was found."

  recovery-probe:
    name: Cross-process recovery probe
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Recover persisted work without redispatch
        shell: bash
        run: |
          database="${RUNNER_TEMP}/director-recovery-ci.sqlite3"
          python scripts/recovery_probe.py seed --database "$database"
          python scripts/recovery_probe.py resume --database "$database"
          python scripts/recovery_probe.py resume --database "$database"
          substituted_database="${RUNNER_TEMP}/director-recovery-substituted-ci.sqlite3"
          python scripts/recovery_probe.py seed --database "$substituted_database"
          python scripts/recovery_probe.py resume-substituted-identity --database "$substituted_database"

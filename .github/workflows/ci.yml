name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  contribution-attribution:
    name: Contribution attribution
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed files and submission envelope
        run: >-
          python scripts/check_contribution_tags.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-event "$GITHUB_EVENT_PATH"

  python:
    name: Python 3.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          SQLITE_PATH: ${{ runner.temp }}/director.sqlite3
      - run: python -m compileall -q src scripts tests
      - run: python -m json.tool n8n/workflows/director-intake.json
      - run: python -m json.tool docs/oracle-review-artifact.example.json

  containers:
    name: Compose and container build
    runs-on: ubuntu-latest
    env:
      DIRECTOR_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - name: Validate isolated Project Uppercut profile
        env:
          DIRECTOR_ENV_FILE: .env.uppercut.example
          DIRECTOR_COMPOSE_PROJECT_NAME: project-uppercut-director-ci
        run: docker compose --env-file .env.uppercut.example config --quiet
      - name: Validate isolated Edge Oracle profile
        env:
          DIRECTOR_ENV_FILE: .env.edge-oracle.example
          DIRECTOR_COMPOSE_PROJECT_NAME: edge-oracle-director-ci
        run: docker compose --env-file .env.edge-oracle.example config --quiet
      - run: docker compose --env-file .env.example build orchestrator

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert no secret-bearing files are committed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env(\..+)?|[^/]+\.(db|sqlite3))$|(^|/)\.venv/'
          allowed='(^|/)\.env(\.[^/]+)?\.example$'

          candidates=$(git ls-files)
          if [ -n "$BASE_SHA" ]; then
            added=$(git log --diff-filter=A --name-only --pretty=format: "$BASE_SHA..HEAD")
            candidates=$(printf '%s\n%s\n' "$candidates" "$added")
          fi

          offenders=$(printf '%s\n' "$candidates" | sed '/^$/d' | sort -u \
            | grep -E "$forbidden" | grep -vE "$allowed" || true)

          if [ -n "$offenders" ]; then
            echo "::error::Secret-bearing or generated files are committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No secret-bearing files are committed."
      - name: Reject credential-shaped committed content
        shell: bash
        run: |
          set -euo pipefail
          pattern='gh[oprsu]_[A-Za-z0-9_]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{30,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          matches=$(git grep -l -E "$pattern" -- ':!.github/workflows/ci.yml' || true)
          if [ -n "$matches" ]; then
            echo "::error::Credential-shaped content found in committed files."
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No credential-shaped content was found."

  recovery-probe:
    name: Cross-process recovery probe
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Recover persisted work without redispatch
        shell: bash
        run: |
          database="${RUNNER_TEMP}/director-recovery-ci.sqlite3"
          python scripts/recovery_probe.py seed --database "$database"
          python scripts/recovery_probe.py resume --database "$database"
          python scripts/recovery_probe.py resume --database "$database"

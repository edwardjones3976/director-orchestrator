name: ${DIRECTOR_COMPOSE_PROJECT_NAME:-director-orchestrator}

services:
  orchestrator:
    build: .
    restart: unless-stopped
    env_file: ${DIRECTOR_ENV_FILE:-.env}
    environment:
      # Compose derives the container-only DSN from one secret-store value. The
      # primary runtime and new-intake gates remain independently default-off.
      LANGGRAPH_PRIMARY_POSTGRES_DSN: postgresql://director_primary:${LANGGRAPH_PRIMARY_POSTGRES_PASSWORD}@langgraph-primary-db:5432/director_primary?sslmode=disable
      # This checked-in local Docker topology is the sole non-loopback exception.
      # Managed/remote production Postgres still requires verify-ca/full TLS.
      LANGGRAPH_PRIMARY_ALLOW_INSECURE_LOCAL_POSTGRES: "true"
      LANGGRAPH_PRIMARY_ACCEPTANCE_MODE: ${LANGGRAPH_PRIMARY_ACCEPTANCE_MODE:-github-v1}
      LANGGRAPH_PRIMARY_ACCEPTANCE_REGISTRY_PATH: /run/director-acceptance-registry/registry.json
      LANGGRAPH_PRIMARY_ACCEPTANCE_REGISTRY_SHA256: ${LANGGRAPH_PRIMARY_ACCEPTANCE_REGISTRY_SHA256:-}
      LANGGRAPH_PRIMARY_ACCEPTANCE_JOURNAL_PATH: /data/primary-acceptance-v2.sqlite3
      DIRECTOR_COMPOSE_PROJECT_NAME: ${DIRECTOR_COMPOSE_PROJECT_NAME:-director-orchestrator}
    ports:
      - "127.0.0.1:${DIRECTOR_HOST_PORT:-8080}:8080"
    volumes:
      - director-data:/data
      - type: bind
        source: ${LANGGRAPH_PRIMARY_ACCEPTANCE_REGISTRY_DIRECTORY:-./.acceptance-registry-disabled}
        target: /run/director-acceptance-registry
        read_only: true
      - type: bind
        source: ${REPOSITORY_SNAPSHOT_HOST_PATH:-./.repository-snapshot-disabled}
        target: /repository
        read_only: true
    depends_on:
      langgraph-primary-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  langgraph-primary-db:
    image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    restart: unless-stopped
    environment:
      POSTGRES_USER: director_primary
      POSTGRES_DB: director_primary
      POSTGRES_PASSWORD: ${LANGGRAPH_PRIMARY_POSTGRES_PASSWORD}
    volumes:
      - langgraph-primary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director_primary -d director_primary"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  slackbot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "director_orchestrator.slack_bot"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://orchestrator:8080}
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_DIRECTOR_CHANNEL_ID: ${SLACK_DIRECTOR_CHANNEL_ID}
      SLACK_OWNER_USER_ID: ${SLACK_OWNER_USER_ID}
      SLACK_GATEWAY_SECRET: ${SLACK_GATEWAY_SECRET}
      # [[Codex | GPT-5.6 | 2026-08-23 08:31 UTC | BEGIN]]
      CHATGPT_BRIDGE_ENABLED: ${CHATGPT_BRIDGE_ENABLED:-false}
      CHATGPT_BRIDGE_SLACK_USER_ID: ${CHATGPT_BRIDGE_SLACK_USER_ID:-U0B9KFJPST1}
      CHATGPT_BRIDGE_CHANNEL_IDS: ${CHATGPT_BRIDGE_CHANNEL_IDS:-}
      CHATGPT_BRIDGE_MAX_PROMPT_CHARS: ${CHATGPT_BRIDGE_MAX_PROMPT_CHARS:-4000}
      # [[Codex | GPT-5.6 | 2026-08-23 08:31 UTC | END]]
      N8N_DIRECTOR_WEBHOOK_URL: ${N8N_DIRECTOR_WEBHOOK_URL:-}
    depends_on:
      orchestrator:
        condition: service_healthy
      n8n:
        condition: service_started

  n8n-db:
    image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest@sha256:d91033b4fac2f7b75c5c4007e10824c66147f7d7a3cccb488720e97452ee7dc7}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      GENERIC_TIMEZONE: ${TZ:-America/Los_Angeles}
    depends_on:
      n8n-db:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  director-data:
  langgraph-primary-db-data:
  n8n-data:
  n8n-db-data:

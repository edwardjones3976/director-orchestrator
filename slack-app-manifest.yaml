_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Aesop Director
  description: Bounded project-director intake and status updates
  background_color: "#1B263B"
features:
  bot_user:
    display_name: Aesop Director
    always_online: true
  slash_commands:
    - command: /director
      description: Start a bounded Director task
      usage_hint: "Project: ... Outcome: ..."
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - groups:history
      # Read-only. Lets the Director verify its own channel: resolve the
      # configured private channel, confirm it is actually a member, and
      # enumerate which provider apps are connected. Without these,
      # conversations.info/members return missing_scope and channel setup
      # can only be audited by hand in the Slack UI.
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
# [[Claude Code | Claude Opus 5 | 2026-09-08 | 06:50 UTC | END]]

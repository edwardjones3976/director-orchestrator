_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Aesop Director
  description: Bounded project-director intake and status updates
  background_color: "#1B263B"
features:
  bot_user:
    display_name: Aesop Director
    always_online: true
  slash_commands:
    - command: /director
      description: Start a bounded Director task
      usage_hint: "Project: ... Outcome: ..."
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false


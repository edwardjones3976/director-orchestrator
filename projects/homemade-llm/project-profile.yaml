schema_version: "director-project-profile/v1"

project:
  id: "homemade-llm"
  name: "Homemade LLM"
  rollout_packet: "rollout-packet.md"
  proposition: "Fine-tune and serve two local models on the owner's PC (RTX 5070 12 GB): DIRECTOR, which writes model-work-packet-v1 packets for this orchestrator, and COMPANION, a friend/conversational persona with long-term memory."
  state: "building" # exploring | framing | building | validating | operating | paused | closed
  owner: "Ed (repository owner)"
  created_at: "2026-09-24T06:05:00Z"
  updated_at: "2026-09-28T02:30:00Z"

source_context:
  thread: "Claude Code session 2026-09-24 (owner chat; plan v1.1.0 pasted by the owner)"
  preserve:
    - "Contribution-tag, envelope, and non-author review rules of director-orchestrator"
    - "Z.ai trial-lane gating pattern (zai_lane.py, zai_trial_readiness) for the M3 local lane"
  reshape:
    - "Repository-level Director role: Claude directs this project only (see provider-roles-contract.yaml deviations)"
  discard:
    - "Ollama serving and the old xo-fleet Open WebUI deployment"
    - "A separate slack-bridge container or Slack app (workspace is at the free-plan app limit)"
  inherited_authority: false

outcomes:
  desired:
    - value: "L1 DIRECTOR launch (end M3, target 2026-11-12): >60 % of packets accepted as-is on both held-out sets; local lane in shadow mode"
      status: "confirmed"
    - value: "L2 COMPANION launch (end M5b, target 2026-12-17): hard-line suite 100 %, judge panel and owner daily-use rating >=4.3/5, memory recall >=8/10"
      status: "confirmed"
    - value: "Measured reduction in paid-API spend; target set at M3 from the M0 baseline"
      status: "provisional"
  non_goals:
    - "Distributing, publishing, or selling any model or dataset"
    - "Cloud GPU training (local only, owner decision O-020)"
    - "Changing repository-level leadership docs or other projects"
  evidence_standard:
    - "Every number in a gate report comes from a file this project wrote and re-read, graded [verified]"
    - "Quality claims cite a promptfoo report, lm-eval JSON, or scorer CSV at a named adapter digest"
  stopping_point: "Each milestone gate is a hard stop; a missed bar moves the date, never the bar (O-022)"


  lanes:
    - id: "review-grok"
      provider: "grok"
      role: "reviewer"
      workflow_skill: "none"
      responsibilities:
        - "Non-author review of Director PRs; for #293, Grok is API-only and cannot merge. Its recorded ACCEPTs are supplementary evidence, not a gate. The prior timed-out attempt at 57b90d2 was not a verdict. Cursor is the single required review-and-merge provider, subject to B2 and all other gates."
      forbidden_authority:
        - "training-data generation (xAI terms: grading only)"
        - "merge"
    - id: "review-cursor"
      provider: "cursor"
      role: "reviewer"
      workflow_skill: "none"
      responsibilities:
        - "After PRESTAGE_REQUIRED and the skill discovery and readiness gate are satisfied, use the verified baseline contract (workflow_skill: none): local cursor-agent CLI in review role, plan mode off, with a no-edit, verdict-in-final-message preamble for non-author exact-head, current-base full-diff review of #293. The thorough reviewer's ACCEPT is the one required review and carries the guarded merge subject to B2 and all deterministic gates."
      forbidden_authority:
        - "authoring or maintaining #293"
        - "reviewing or merging its own work"
        - "merging without B2 and all required gates satisfied"
    - id: "review-codex"
      provider: "other"
      role: "reviewer"
      workflow_skill: "none"
      responsibilities:
        - "Fallback non-author reviewer only where independent; Codex assisted #293 and is not its reviewer of record"
      forbidden_authority:
        - "merge"
    - id: "research-perplexity"
      provider: "perplexity"
      role: "researcher"
      workflow_skill: "perplexity-research-workflow"
      responsibilities:
        - "Public, citation-backed research briefs"
      forbidden_authority:
        - "repository context"
        - "operational verdicts"
  shared_skill_catalog:
    cursor_agent_workflow: "unknown"
    antigravity_sandbox_workflow: "unknown"
    perplexity_research_workflow: "unknown"


  name: "Homemade LLM"
  rollout_packet: "rollout-packet.md"
  proposition: "Fine-tune and serve two local models on the owner's PC (RTX 5070 12 GB): DIRECTOR, which writes model-work-packet-v1 packets for this orchestrator, and COMPANION, a friend/conversational persona with long-term memory."
  state: "building" # exploring | framing | building | validating | operating | paused | closed
  owner: "Ed (repository owner)"
  created_at: "2026-09-24T06:05:00Z"
  updated_at: "2026-09-27T13:41:33Z"


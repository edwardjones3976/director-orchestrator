# SearXNG for Open WebUI (M0.5). Defaults plus the JSON output format Open WebUI's searxng engine needs.
# The secret comes from SEARXNG_SECRET in C:\llm\secrets\open-webui.env, never from this file.
use_default_settings: true
server:
  limiter: false          # local-only instance behind Open WebUI; no public clients to rate-limit
  image_proxy: false
search:
  safe_search: 1
  formats:
    - html
    - json
